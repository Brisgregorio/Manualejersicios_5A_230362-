<div
  *ngIf="sidebarVisible"
  class="bg-white  text-gray-800 h-screen w-80 p-6 border-r border-gray-300 shadow-md overflow-y-auto"
>
  <h2 class="text-2xl font-semibold mb-8">Prácticas de Angular</h2>

 
  <div *ngIf="practicaSeleccionada" class="bg-gray-100 text-gray-600 mt-2 p-3 rounded-lg shadow-inner transition-all duration-300">
    <h5 class="text-lg font-semibold">Nombre:</h5>
    <p>{{ practicaSeleccionada.ejercicio }}</p>
    <h5 class="text-lg font-semibold">Objetivo:</h5>
    <p>{{ practicaSeleccionada.objetivo }}</p>
    <h5 class="text-lg font-semibold mt-4">Descripción:</h5>
    <p>{{ practicaSeleccionada.descripcion }}</p>
    <h5 class="text-lg font-semibold mt-4">Unidad:</h5>
    <p>{{ practicaSeleccionada.unidad }}</p>
  </div>
</div>
