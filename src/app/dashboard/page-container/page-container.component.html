<div class="flex flex-col h-screen bg-gradient-to-r from-[#A5D6A7] to-[#81C784]">

  <app-navbar></app-navbar>

  <!-- Contenedor principal -->
  <div class="flex flex-1 mt-20">
    <!-- Sidebar -->
    <app-sidebar
      class="transition-all duration-300 ease-in-out shadow-lg rounded-lg"
      [ngClass]="{'hidden': !isSidebarVisible, 'w-1/4': isSidebarVisible, 'w-0': !isSidebarVisible}">
    </app-sidebar>

    <!-- Contenido principal -->
    <div 
      [ngClass]="{'w-full': !isSidebarVisible, 'w-3/4': isSidebarVisible}"
      class="transition-all duration-300 ease-in-out">
      <app-content></app-content>
    </div>
  </div>

  <!-- Botón para mostrar/ocultar el sidebar -->
  <button 
    (click)="toggleSidebar()" 
    class="fixed top-5 left-4 bg-[#388E3C] text-white p-4 rounded-full shadow-lg hover:bg-[#2C6E34] focus:outline-none focus:ring-2 focus:ring-[#388E3C] transform transition-all duration-300 ease-in-out z-80">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
    </svg>
  </button>

</div>
