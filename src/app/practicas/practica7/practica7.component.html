<button (click)="greet()" 
        style="background-color: #388E3C; color: #FFFFFF; font-size: 16px; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; transition: background-color 0.3s ease;">
  Saluda
</button>

<section (mouseover)="onMouseOver()" (mouseleave)="onMouseLeave()" 
         style="font-family: 'Arial', sans-serif; font-size: 18px; color: #2E7D32; padding: 20px; border-radius: 10px; background-color: #A5D6A7; border: 2px solid #81C784; margin-top: 15px; text-align: center;">
  Te tengo un secreto
  <span class="message" 
        style="display: inline-block; margin-top: 10px; color: #388E3C; font-weight: bold; font-size: 20px;">
    {{ message }}
  </span>
</section>
