<div class="operating-systems" style="font-family: 'Arial', sans-serif; font-size: 18px; padding: 15px; border-radius: 10px; background-color: #C8E6C9; border: 2px solid #81C784;">
  @for (os of operatingSystems; track os.id) {
    <span style="display: block; margin-bottom: 8px; color: #388E3C; font-weight: bold;">
      {{ os.name }}
    </span>
  }
</div>

<div class="users" style="font-family: 'Verdana', sans-serif; font-size: 16px; padding: 15px; border-radius: 10px; background-color: #E8F5E9; border: 2px solid #66BB6A;">
  @for (user of users; track user.id) {
    <p style="color: #2E7D32; font-weight: normal; margin: 5px 0;">
      {{ user.name }}
    </p>
  }
</div>
